<script>
document.addEventListener('DOMContentLoaded', function() {
"use strict";

// ============================================================
//  CONFIGURACIÓN, LICENCIA, USUARIOS, etc.
//  (todo el JavaScript es el mismo, solo cambiamos el manifest)
// ============================================================

// ============================================================
//  PWA MANIFEST (actualizado con las rutas correctas)
// ============================================================
const manifest = {
  name: "Café POS",
  short_name: "Café POS",
  start_url: "./",
  display: "standalone",
  background_color: "#FBF6ED",
  theme_color: "#1F3D2B",
  icons: [
    { src: "/logo-192.png", sizes: "192x192", type: "image/png" },
    { src: "/logo-512.png", sizes: "512x512", type: "image/png", purpose: "any maskable" }
  ]
};
const manifestBlob = new Blob([JSON.stringify(manifest)], {type:"application/manifest+json"});
const manifestUrl = URL.createObjectURL(manifestBlob);
const manifestLink = document.createElement("link");
manifestLink.rel = "manifest";
manifestLink.href = manifestUrl;
document.head.appendChild(manifestLink);

// ============================================================
//  RESTO DEL CÓDIGO (licencia, usuarios, productos, etc.)
//  todo exactamente igual a tu código original
// ============================================================

// ... (aquí va todo tu código JavaScript sin cambios, solo el manifest actualizado)

}); // fin DOMContentLoaded
</script>
